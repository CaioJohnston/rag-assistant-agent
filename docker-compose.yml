version: "3.9"
services:
  app:
    build: ./app
    env_file: .env
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      - postgres
      - chroma

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"

volumes:
  pgdata: